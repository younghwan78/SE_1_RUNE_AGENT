services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rune_agent_test
      POSTGRES_USER: rune
      POSTGRES_PASSWORD: rune
    ports:
      - "${RUNE_IT_POSTGRES_PORT:-16432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rune -d rune_agent_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/rune_integration_password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_dbms_security_auth__minimum__password__length: 8
    ports:
      - "${RUNE_IT_NEO4J_HTTP_PORT:-17474}:7474"
      - "${RUNE_IT_NEO4J_BOLT_PORT:-17687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "${RUNE_IT_QDRANT_HTTP_PORT:-16333}:6333"
      - "${RUNE_IT_QDRANT_GRPC_PORT:-16334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
