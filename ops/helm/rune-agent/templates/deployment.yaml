apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rune-agent.fullname" . }}
  labels:
    {{- include "rune-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rune-agent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "rune-agent.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rune-agent.serviceAccountName" . }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rune-agent.fullname" . }}-config
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret.name is required" .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.postgresDsn }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret.name is required" .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.neo4jPassword }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret.name is required" .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.qdrantApiKey }}
                  optional: true
            - name: MODEL_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret.name is required" .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.modelGatewayApiKey }}
                  optional: true
            - name: TRUSTED_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret.name is required" .Values.existingSecret.name }}
                  key: {{ .Values.existingSecret.keys.trustedProxySecret }}
          {{- if .Values.artifactVolume.enabled }}
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/rune-agent/artifacts
          {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.artifactVolume.enabled }}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-artifacts" (include "rune-agent.fullname" .)) .Values.artifactVolume.existingClaim }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
