global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rune-agent-alerts.yml

scrape_configs:
  - job_name: rune-agent-api
    metrics_path: /api/v1/metrics
    scheme: http
    static_configs:
      - targets:
          - 127.0.0.1:8000
        labels:
          service: rune-agent-api
          environment: staging
