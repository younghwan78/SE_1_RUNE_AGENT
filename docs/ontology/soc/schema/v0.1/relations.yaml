      - {name: confidence, type: float}
      - {name: source, type: enum, values: [rule, claude, manual, fixture]}

  - name: assignedTo
    from: Issue
    to: Person
    cardinality: many-to-one
    properties:
      - {name: confidence, type: float}
      - {name: source, type: enum, values: [rule, claude, manual, fixture]}

  - name: hasLifecycleEvent
    from: Artifact
