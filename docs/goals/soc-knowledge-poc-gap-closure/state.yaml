# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "SoC Knowledge PoC Gap Closure"
  slug: "soc-knowledge-poc-gap-closure"
  kind: existing_plan
  tranche: "continuous execution: validate the current gap map, close successive safe verified SoC Knowledge PoC gaps, and continue until final audit proves the design target is satisfied or only named external blockers remain"
  status: active
  oracle:
    signal: "Current files plus fresh verification outputs prove every material requirement in SoC_Knowledge_PoC_Design_v4.0.md is implemented, verified, reflected in the gap report, or explicitly blocked by named external evidence."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge or PM receipt maps gap-report rows, design requirements, changed files, and verification commands to full_outcome_complete: true with no required queued Worker task."
  intake:
    original_request: "기존에 구현된 코드를 SoC_Knowledge_PoC_Design_v4.0.md 문서를 참조해서 수정하는 것을 goal로 진행하고 있어. 현재 정확한 구현 상황과 gap을 참조해서 단계별로 적절한 goal을 세우고 이를 기준으로 실행하게 상세 목표를 잡아줘"
    interpreted_outcome: "Prepare a detailed GoalBuddy execution board that uses the current implementation and gap report to keep closing gaps against the SoC Knowledge PoC design."
    input_shape: existing_plan
    audience: "project owner and future /goal execution PM"
    authority: requested
    proof_type: test
    completion_proof: "Fresh audit evidence shows SoC_Knowledge_PoC_Design_v4.0.md is satisfied by implementation, tests, live or skip-safe gates, and documented residual blockers."
    likely_misfire: "Completing more small scaffolds or documentation while leaving high-risk design-critical behavior, live evidence, or integration gaps unresolved."
    blind_spots_considered:
      - "The current worktree may contain many uncommitted changes from prior iterations and user work."
      - "Prior chat context may be stale; current files and command output are authoritative."
      - "Some remaining gaps may require external credentials, live local models, Claude Code access, or target database services."
      - "Existing implementation should be reused when it aligns with the production plan; avoid unnecessary rewrite."
    existing_plan_facts:
      - "Repository source of truth: PRODUCTION_EXECUTION_PLAN.md."
      - "PoC target design: SoC_Knowledge_PoC_Design_v4.0.md."
      - "Working gap report: docs/implementation/12_SOC_KNOWLEDGE_POC_GAP_REPORT.md."
      - "Approved graph data and pending AI proposals must stay logically separate."
      - "All LLM calls must go through the model gateway and remain traceable."
      - "Source-access procedures belong in Claude Code source skills; MCP tool names must not leak into product code."
      - "Use Python 3.12+, uv, Pydantic, FastAPI, type hints, structured logs, and tests matched to blast radius."
      - "Do not reintroduce removed PRD files."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://localhost:41737/soc-knowledge-poc-gap-closure/"
    command: "npx goalbuddy board E:\\51_Codex_MBSE_Agent\\docs\\goals\\soc-knowledge-poc-gap-closure"

active_task: T030

