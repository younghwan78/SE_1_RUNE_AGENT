name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: production-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

      - name: Masking policy rehearsal
        run: uv run python ops/security/rehearse_masking_policy.py

      - name: Release blocker coverage gate
        run: uv run python ops/security/check_release_blockers.py

      - name: Source boundary validation
        run: uv run python ops/source/validate_source_boundaries.py

      - name: Source adapter smoke
        run: uv run python ops/source/smoke_source_adapters.py

      - name: Source skill export rehearsal
        run: uv run python ops/source/rehearse_skill_export_sources.py

      - name: Model gateway smoke
        run: uv run python ops/model_gateway/smoke_model_gateway.py

      - name: Helm chart scaffold validation
        run: uv run python ops/helm/validate_chart.py

      - name: Observability asset validation
        run: uv run python ops/observability/validate_observability_assets.py

      - name: PostgreSQL migration rollback validation
        run: uv run python ops/rehearsal/validate_postgres_migration_rollbacks.py

      - name: PostgreSQL typed mirror validation
        run: uv run python ops/rehearsal/validate_postgres_typed_mirrors.py

      - name: Readiness evidence template smoke
        run: uv run python ops/rehearsal/check_production_readiness.py --write-evidence-template -

      - name: Staging evidence plan smoke
        run: uv run python ops/rehearsal/build_staging_evidence_plan.py --format markdown

      - name: Release scope artifact validation
        run: uv run python ops/rehearsal/validate_release_scope_artifacts.py

      - name: Goal completion audit
        run: uv run python ops/rehearsal/check_goal_completion.py --allow-incomplete

      - name: Readiness example safety validation
        run: uv run python ops/rehearsal/validate_evidence_example.py

      - name: CI gate coverage validation
        run: uv run python ops/rehearsal/validate_ci_gate_coverage.py

      - name: Operator UI graph smoke
        run: uv run python ops/ui/smoke_operator_ui.py

      - name: Feedback eval rehearsal
        run: uv run python ops/evals/run_feedback_eval_rehearsal.py
